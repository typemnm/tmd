[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tmd"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.85",
    "markdown-it-py>=3.0",
    "mdit-py-plugins>=0.4",
]

[project.scripts]
tmd = "tmd.app:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
